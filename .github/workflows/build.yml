name: Java CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build JARs
        run: ./gradlew build :main:shaded --build-cache

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: NightCore
          path: main/build/libs/main-shaded.jar
          if-no-files-found: error
          archive: false
